name: dast

on:
  push:
    branches: ["main-x"]

env:
  REGISTRY: jdarzz
  IMAGE_NAME: rest_api

jobs:
  dast:
    permissions:
      issues: write

    name: ZAP - DAST Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        name: Checkout code

      - name: run api
        run: |
          npm install --legacy-peer-deps
          npm run dev > api.log 2>&1 &
          sleep 10
          curl http://localhost:3000/search?q=123

      - name: ZAP Scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: 'http://localhost:3000/search?q=123'